name: news_template_maker
description: Hybrid offline-first Flutter mobile app for video template creation and editing with cloud AI integration. Fully functional with all pro features unlocked.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # STATE MANAGEMENT
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  state_notifier: ^1.0.0

  # VIDEO PROCESSING & PLAYBACK
  ffmpeg_kit_flutter_new: ^4.6.0
  video_player: ^2.8.6
  chewie: ^1.8.5

  # MEDIA & FILE HANDLING
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  image: ^4.2.0
  path_provider: ^2.1.3

  # AUDIO PROCESSING
  just_audio: ^0.9.38
  record: ^5.2.0
  flutter_sound: ^9.2.13
  audio_waveforms: ^1.0.8

  # LOCAL STORAGE & DATABASE
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  isar: ^3.1.0+1
  sqflite: ^2.3.3+1

  # NETWORK & CONNECTIVITY
  connectivity_plus: ^5.0.2
  http: ^1.2.0
  dio: ^5.4.0
  firebase_core: ^2.32.0
  firebase_storage: ^11.7.7
  firebase_analytics: ^10.10.7

  # UI & DESIGN
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  percent_indicator: ^4.2.3

  # PERMISSIONS & DEVICE
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  sensors_plus: ^6.0.0

  # UTILITIES
  uuid: ^4.4.0
  intl: ^0.19.0
  share_plus: ^7.2.2
  url_launcher: ^6.3.0
  logger: ^2.3.0

  # JSON SERIALIZATION
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # BACKGROUND PROCESSING
  workmanager: ^0.5.0
  flutter_background_service: ^5.0.5

  # PLATFORM SPECIFIC
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  isar_generator: ^3.1.0+1
  freezed: ^2.5.2

dependency_overrides:
  record_platform_interface: 1.1.0

flutter:
  uses-material-design: true

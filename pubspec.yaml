name: news_template_maker
description: Hybrid offline-first Flutter mobile app for video template creation and editing with cloud AI integration. Fully functional with all pro features unlocked.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # STATE MANAGEMENT
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  state_notifier: ^1.0.0

  # VIDEO PROCESSING & PLAYBACK
  ffmpeg_kit_flutter: ^6.0.3
  video_player: ^2.8.0
  chewie: ^1.8.0

  # MEDIA & FILE HANDLING
  image_picker: ^1.0.4
  file_picker: ^6.0.0
  image: ^4.0.17
  path_provider: ^2.1.2

  # AUDIO PROCESSING
  just_audio: ^0.9.31
  record: ^5.2.1
  flutter_sound: ^9.2.13
  audio_waveforms: ^1.0.7

  # LOCAL STORAGE & DATABASE
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  isar: ^3.1.0
  sqflite: ^2.3.0

  # NETWORK & CONNECTIVITY
  connectivity_plus: ^5.0.0
  http: ^1.1.0
  dio: ^5.3.0
  firebase_core: ^2.24.0
  firebase_storage: ^11.4.0
  firebase_analytics: ^10.4.0

  # UI & DESIGN
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.4.0
  percent_indicator: ^4.1.1

  # PERMISSIONS & DEVICE
  permission_handler: ^11.4.0
  device_info_plus: ^9.1.0
  sensors_plus: ^1.4.0

  # UTILITIES
  uuid: ^4.0.0
  intl: ^0.19.0
  share_plus: ^7.2.0
  url_launcher: ^6.2.0
  logger: ^2.0.1

  # JSON SERIALIZATION
  json_serializable: ^6.7.0
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  # BACKGROUND PROCESSING
  workmanager: ^0.5.1
  flutter_background_service: ^5.0.5

  # PLATFORM SPECIFIC
  flutter_native_splash: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.0
  isar_generator: ^3.1.0
  freezed: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/templates/
    - assets/templates/news_headlines/
    - assets/templates/festival_cards/
    - assets/templates/trending_shorts/
    - assets/icons/
    - assets/stickers/
    - assets/fonts/
    - assets/sample_audio/
    - assets/sample_videos/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#121212"
  color_dark: "#121212"
  image: assets/icons/splash_icon.png
  branding: assets/icons/branding.png
  android_12:
    image: assets/icons/splash_icon_android_12.png
    color: "#121212"
